<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="Escolta Pro — Executive protection" />
    <meta property="og:description" content="Vetted close-protection professionals, booked in minutes and tracked in real time." />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Reset recomendado por react-native-web, con el fondo de la marca para
         que nunca se vea blanco al cargar ni al hacer rebote de scroll. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0a0a09;
        color: #f4f1ea;
      }
      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      ::selection {
        background: rgba(201, 164, 92, 0.35);
      }
      :focus-visible {
        outline: 2px solid rgba(201, 164, 92, 0.7);
        outline-offset: 2px;
      }
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to use Escolta Pro.</noscript>
    <div id="root"></div>
  </body>
</html>
